<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fondamento:ital@0;1&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Get on the bus!</title>
</head>
<style>
    body{
        background-color: #FDF8E2;
        font-family: "Lilita One", sans-serif;
        color: #504E76;
    }
    h1 {
        text-align: center;
        margin-top: 50px;
    }
    h2 {
        text-align: center;
        margin-top: -20px;
        font-weight: 100;
    }
   #bus{
            width: 320px;
            display: block;
            position: relative;
            left: 0;
            align-items: center;
            margin-left: 40%;
            margin-top: -20px;
            cursor: pointer;
            transition:
            left 1.1s cubic-bezier(0.55, 0, 0.75, 0.3),
            transform 1.1s ease;
        }

        #bus:hover {
            filter: brightness(1.08);
        }

        #busimage.departing #bus {
            left: -100%;
            transform: rotate(-3deg);
        }

        #busimage.departing {
            animation: fadeOut 0.5s ease 0.6s forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

         @media (max-width: 600px) {
            #bus {
                width: 320px;
            }

            #busimage.departing #bus {
                left: -100%;
            }
        }

        h3 {
            margin-top: -40px;
            font-family: "Lilita One", sans-serif;
            color: #504E76;
            font-weight: 20;
            font-size: smaller;
            text-align: center;
        }
</style>
<body>
    <h1>Welcome Abroad!</h1> 
    <h2>Are you ready to go visit some universities?</h2>
    <section id="busimage">
        <img id="bus" src="bus.gif" role="button">
    </section>
    <h3>Foreign Students in Taiwan data visualization Dashboard <br>
        113AT0011 Katriela Nicoline S. 曾芝嫻
    </h3>
   
<script>
    const bus = document.getElementById("bus");
    const openingPage = document.getElementById("busimage");

    let hasStarted = false;

    function startJourney() {
        if (hasStarted) return;

        hasStarted = true;

        openingPage.classList.add("departing");

        setTimeout(() => {
            window.location.href = "ForeignStudents.html"; //go to the map page
        }, 1200);
    }

    bus.addEventListener("click", startJourney); //click to start animation
</script>

</body>
</html>
